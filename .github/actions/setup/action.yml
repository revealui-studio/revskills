name: Set up RevSkills tools
description: Install the pinned runtime and dependencies without lifecycle scripts.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.13.1'
    - shell: bash
      run: npm install --global pnpm@10.28.2 --ignore-scripts
    - shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
